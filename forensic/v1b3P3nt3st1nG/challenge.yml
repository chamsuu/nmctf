  configuration files, session logs, and database artifacts.

  Your mission: investigate the compromise, identify the attacker's methods,
  and reconstruct exactly what happened — including what instructions the
  attacker gave to their tool.

  Connect to the question server to submit your findings. Answer all 12 questions
  correctly to receive the flag. One wrong answer and the connection terminates.

