name: "NIT Breach [1/3]"
category: Forensic
description: |
  Researchers from the Numidia Institute Of Technology (NIT) contact you following a major cyberattack they have recently suffered. The attacker allegedly compromised their main server containing critical research data and exfiltrated most of the information before deleting the traces of the intrusion.

  They provide you with a network capture covering the attack period, from the initial reconnaissance phase to data exfiltration.

  By analyzing the capture, retrieve the following information:
  - Attacker's IP address
  - Victim server's IP address
  - Apache server version on the server
  - CVE number exploited to take control of the server
  - Target port of the reverse shell set up by the attacker on the server

  Flag format: nmctf{attacker_ip_victim_ip_apache_version_cve_target_port}

  Note: The capture contains background noise and red herrings. Identify the actual malicious traffic.
difficulty: medium
author: 4mdj4d
type: static
