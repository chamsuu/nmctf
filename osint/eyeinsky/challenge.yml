description: |-
  A kidnapping has taken place near the location shown in the
  attached photograph. The image was obtained from a witness
  who was in the area moments before the incident occurred.

  Your mission is to identify the surveillance camera that
  may have captured the incident, and the building it is
  mounted on.

  You must determine:
  1. The full address of the building the camera is installed on
  2. Who operates the camera

