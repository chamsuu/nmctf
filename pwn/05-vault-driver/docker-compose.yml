name: "Vault Driver"
category: Kernel
description: "The Power Grid Controller is protected by proprietary ARM64 defenses. Can you break in?"
author: N4dj1b
type: static
value: 500

connection_info: nc vault-driver.pwn.vuln3ra.com 13375
files:
- dist/bzImage
- dist/rootfs.cpio.gz
- dist/vault_sec.ko
- dist/README.md
flag: nmctf{K3RN3L_R4C3_CR3D_0V3RW173}

version: "3.8"
services:
  vault-driver:
    build: .
    image: pixelvault/vault-driver:latest
    container_name: challenge-05-vault-driver
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
    ports:
      - "13375:1337"
    restart: unless-stopped
    environment:
      - FLAG=nmctf{K3RN3L_R4C3_CR3D_0V3RW173}
    mem_limit: 1g
    cpus: 2.0