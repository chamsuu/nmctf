version: "3.8"
services:
  01-entry-gate:
    build: ./01-entry-gate
    image: pwn/entry-gate:latest
    container_name: pwn-challenge-01-entry-gate
    ports:
      - "13371:1337"
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp

  02-token-terminal:
    build: ./02-token-terminal
    image: pwn/token-terminal:latest
    container_name: pwn-challenge-02-token-terminal
    ports:
      - "13372:1337"
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  03-staff-chat:
    build: ./03-staff-chat
    image: pwn/staff-chat:latest
    container_name: pwn-challenge-03-staff-chat
    ports:
      - "13373:1337"
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  04-power-grid:
    build: ./04-power-grid
    image: pwn/power-grid:latest
    container_name: pwn-challenge-04-power-grid
    ports:
      - "13374:1337"
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

  05-vault-driver:
    build: ./05-vault-driver
    image: pwn/vault-driver:latest
    container_name: pwn-challenge-05-vault-driver
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
    ports:
      - "13375:1337"
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2.0


